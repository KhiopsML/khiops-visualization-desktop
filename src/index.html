<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Khiops Visualization Desktop</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <style>
      .welcome-header {
        display: flex;
        align-items: center;
        flex-direction: column;
        margin-bottom: 40px;
        align-items: center;
        justify-content: center;

        span {
          font-size: 16px;
          font-weight: 700;
          color: #393f4d;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="app-loading-screen"
      style="
        background: #ffffff;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s ease-out;
      "
    >
      <div class="welcome-header">
        <svg
          version="1.0"
          width="60"
          height="60"
          viewBox="0 0 496.31 305.509"
          xmlns="http://www.w3.org/2000/svg"
        >
          <style>
            /* Stagger index for each triangle */
            .s1 {
              --i: 0;
            }
            .s2 {
              --i: 1;
            }
            .s3 {
              --i: 2;
            }
            .s4 {
              --i: 3;
            }
            .s5 {
              --i: 4;
            }
            .s6 {
              --i: 5;
            }
            .s7 {
              --i: 6;
            }
            .s8 {
              --i: 7;
            }

            /* Fade up on entry, short lift on exit */
            @keyframes cascade {
              0% {
                opacity: 0;
                transform: translateY(14px);
              }
              22%,
              70% {
                opacity: 1;
                transform: none;
              }
              92%,
              100% {
                opacity: 0;
                transform: translateY(-8px);
              }
            }

            .shape {
              opacity: 0;
              animation: cascade 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
              animation-delay: calc(var(--i) * 0.07s);
            }

            /* Respect users who prefer reduced motion */
            @media (prefers-reduced-motion: reduce) {
              .shape {
                animation: none;
                opacity: 1;
              }
            }
          </style>

          <path
            class="shape s1"
            style="
              fill: #5f9ac7;
              stroke: #5f9ac7;
              stroke-width: 2;
              stroke-linejoin: round;
            "
            d="m259.43 0 10.732 41.142-94.356 28.827z"
          />
          <path
            class="shape s2"
            style="
              fill: #2e5674;
              stroke: #2e5674;
              stroke-width: 2;
              stroke-linejoin: round;
            "
            d="m259.43 0 10.732 41.142 39.138 9.382z"
          />
          <path
            class="shape s3"
            style="
              fill: #91cb47;
              stroke: #91cb47;
              stroke-width: 2;
              stroke-linejoin: round;
            "
            d="m276.207 64.315 12.806 49.09-165.849 29.05z"
          />
          <path
            class="shape s4"
            style="
              fill: #527823;
              stroke: #527823;
              stroke-width: 2;
              stroke-linejoin: round;
            "
            d="m276.207 64.315 12.806 49.09 78.288 11.98z"
          />
          <path
            class="shape s5"
            style="
              fill: #ffb448;
              stroke: #ffb448;
              stroke-width: 2;
              stroke-linejoin: round;
            "
            d="m295.528 138.378 13.514 51.806-246.25 33.15z"
          />
          <path
            class="shape s6"
            style="
              fill: #996823;
              stroke: #996823;
              stroke-width: 2;
              stroke-linejoin: round;
            "
            d="m295.528 138.378 13.514 51.806 119.647 21.577z"
          />
          <path
            class="shape s7"
            style="
              fill: #ed614e;
              stroke: #ed614e;
              stroke-width: 2;
              stroke-linejoin: round;
            "
            d="m316.075 217.14 15.414 59.091-331.49 28.495z"
          />
          <path
            class="shape s8"
            style="
              fill: #8e3327;
              stroke: #8e3327;
              stroke-width: 2;
              stroke-linejoin: round;
            "
            d="m316.075 217.14 15.414 59.091 164.82 29.278z"
          />
        </svg>
        <span>Khiops Visualization Desktop</span>
      </div>
    </div>
    <app-root></app-root>
    <script>
      // Ensure loading screen is visible for at least 1 second
      setTimeout(() => {
        const loadingScreen = document.getElementById('app-loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          loadingScreen.style.pointerEvents = 'none';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 300); // Allow fade-out transition
        }
      }, 1000);
    </script>
  </body>
</html>

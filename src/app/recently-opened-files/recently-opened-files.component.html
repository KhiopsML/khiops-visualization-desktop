<div id="app-recently-opened-files">
  <div class="recent-files-header">
    <h3>
      <svg lucideClock3 size="16" aria-hidden="true"></svg>
      {{ 'RECENTLY_OPENED_FILES' | translate }}
      <span class="files-count"
        >{{ recentFiles.length }} {{ 'FILES' | translate }}</span
      >
    </h3>
    <div class="toolbar" *ngIf="recentFiles.length > 0">
      <label
        class="filter-input-wrapper"
        [attr.aria-label]="'FILTER_RECENT_FILES' | translate"
      >
        <svg lucideSearch size="14" aria-hidden="true"></svg>
        <input
          type="search"
          [value]="filterValue"
          (input)="onFilterInput($event)"
          [placeholder]="'FILTER_RECENT_FILES' | translate"
        />
      </label>
    </div>
  </div>

  <ul class="recent-files-list" *ngIf="filteredRecentFiles.length > 0">
    <li *ngFor="let file of filteredRecentFiles" class="recent-file-item">
      <button type="button" class="file-button" (click)="openFile(file.path)">
        <div class="file-info">
          <span
            class="file-type-icon"
            [ngClass]="'icon-' + file.fileType"
            [title]="file.fileType"
          >
            <img
              *ngIf="file.fileType === 'visualization'"
              src="assets/icons/icon-visu.png"
              alt="Visualization"
              width="20"
              height="20"
            />
            <img
              *ngIf="file.fileType === 'covisualization'"
              src="assets/icons/icon-covisu.png"
              alt="Covisualization"
              width="20"
              height="20"
            />
            <svg
              *ngIf="showFallbackIcon(file) && isJsonFile(file.filename)"
              lucideFileJson2
              size="17"
              aria-hidden="true"
            ></svg>
            <svg
              *ngIf="showFallbackIcon(file) && !isJsonFile(file.filename)"
              lucideFile
              size="17"
              aria-hidden="true"
            ></svg>
          </span>
          <div>
            <div>
              <span class="file-name">{{ file.filename }}</span>
              <span class="file-size font-code">{{ file.sizeDisplay }}</span>
            </div>
            <span class="file-path font-code">{{ file.path }}</span>
          </div>
        </div>
      </button>
    </li>
  </ul>
  <p *ngIf="recentFiles.length === 0">{{ 'NO_RECENT_FILES' | translate }}</p>
  <p *ngIf="recentFiles.length > 0 && filteredRecentFiles.length === 0">
    {{ 'NO_MATCHING_RECENT_FILES' | translate }}
  </p>
</div>

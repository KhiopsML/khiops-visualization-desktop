<div class="start-panel-container" *ngIf="shortcut">
  <h3>
    <svg lucideFolderOpen size="16" aria-hidden="true"></svg>
    {{ 'START_BY_LOADING_DATASET' | translate }}
    <span class="format-note font-code">Native Khiops Format & JSON</span>
  </h3>

  <div class="drop-zone">
    <div class="shortcut-item">
      <button class="description" type="button" (click)="openFile()">
        <span>{{ shortcut.description | translate }}</span>
        <div class="keys">
          <span class="key" *ngFor="let key of shortcut.keys; let last = last">
            <span class="key-label font-code">{{ getKeyDisplay(key) }}</span>
            <span class="key-plus font-code" *ngIf="!last">+</span>
          </span>
        </div>
      </button>
    </div>

    <p class="drop-help">
      drag & drop your <strong>.json</strong>, <strong>.khj</strong>, or
      <strong>.khcj</strong> files directly anywhere here
    </p>

    <div class="format-tags" aria-hidden="true">
      <span>Khj (Khiops JSON)</span>
      <span>Khcj (Khiops Clustering)</span>
      <span>Standard JSON</span>
    </div>
  </div>
</div>

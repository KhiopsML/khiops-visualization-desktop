<div class="app-container">
  <!-- Tab header -->
  <app-tab-header></app-tab-header>

  <!-- Main content area -->
  <div
    class="main-content"
    [class.drag-over]="isDragOver"
    (dragenter)="onDragEnter($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <div class="drag-drop-overlay" aria-hidden="true">
      <div class="drag-drop-overlay-card drag-drop-overlay--default">
        <svg
          class="drag-drop-overlay-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" />
          <path d="M14 2v4a2 2 0 0 0 2 2h4" />
          <path d="M12 18v-6" />
          <path d="m9 15 3 3 3-3" />
        </svg>
        <div class="drag-drop-overlay-title">
          {{ 'GLOBAL_DROP_YOUR_FILE_HERE' | translate }}
        </div>
        <div class="drag-drop-overlay-badges">
          <span class="drag-drop-badge drag-drop-badge--blue">*.json</span>
          <span class="drag-drop-badge drag-drop-badge--orange">*.khj</span>
          <span class="drag-drop-badge drag-drop-badge--orange">*.khcj</span>
        </div>
      </div>
    </div>

    <!-- Welcome screen - shown when no tabs have files -->
    <app-welcome *ngIf="!activeTab || !activeTab.filePath"></app-welcome>

    <!-- Tab content containers -->
    <div class="tab-content-container">
      <!-- Big file loading component -->
      <app-big-file-loading></app-big-file-loading>

      <!-- One component per tab based on its type -->
      <div
        *ngFor="let tab of tabs; trackBy: trackByTabId"
        [style.display]="tab.isActive ? 'block' : 'none'"
        style="width: 100%; height: 100%"
      >
        <!-- Visualization component for this tab (always created) -->
        <khiops-visualization
          *ngIf="tab.componentType === 'visualization'"
          #khiopsComponent
          [attr.data-tab-id]="tab.id"
          style="visibility: visible !important; width: 100%; height: 100%"
        >
        </khiops-visualization>

        <!-- Covisualization component for this tab (always created) -->
        <khiops-covisualization
          *ngIf="tab.componentType === 'covisualization'"
          #khiopsComponent
          [attr.data-tab-id]="tab.id"
          style="visibility: visible !important; width: 100%; height: 100%"
        >
        </khiops-covisualization>
      </div>
    </div>
  </div>
</div>
